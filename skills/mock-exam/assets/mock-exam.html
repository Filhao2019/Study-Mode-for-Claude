<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock Exam</title>
<!--
  Studying with Claude: timed mock exam template.
  To use: replace the JSON in the application/json script block whose id is "exam-data" (near the end of the file) with the exam. Everything else stays as is.
  Timing: "total" (one clock, move freely between all questions) or "sections" (each section has its
  own clock and closes when you move on or its time runs out, like many real exams).
  Question types: mcq, tf, fill, short, significance, essay. Each question can carry "points".
  Inside the JSON, write "<\/" instead of "</" and escape backslashes in LaTeX ("\\frac").
-->
<style>
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --surface-2: #efede7; --text: #1c1b19; --muted: #5d5b55;
    --border: #d9d6ce; --accent: #3550c8; --accent-text: #ffffff; --accent-soft: #e6eafb;
    --good: #22753a; --good-bg: #e3f3e7; --bad: #b42323; --bad-bg: #fbe9e9; --warn: #8a5600; --warn-bg: #fff1d9;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --surface: #1d1d1b; --surface-2: #282825; --text: #ecebe6; --muted: #a9a79f;
      --border: #3a3935; --accent: #91a3ff; --accent-text: #10131f; --accent-soft: #252b45;
      --good: #6fd389; --good-bg: #1a3122; --bad: #ff8a8a; --bad-bg: #3a1d1d; --warn: #ffc470; --warn-bg: #39291a;
      --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413; --surface: #1d1d1b; --surface-2: #282825; --text: #ecebe6; --muted: #a9a79f;
    --border: #3a3935; --accent: #91a3ff; --accent-text: #10131f; --accent-soft: #252b45;
    --good: #6fd389; --good-bg: #1a3122; --bad: #ff8a8a; --bad-bg: #3a1d1d; --warn: #ffc470; --warn-bg: #39291a;
    --shadow: none; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .bar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 10px;
         padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo { font-size: 22px; }
  .title { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .subtitle { color: var(--muted); font-size: 13px; }
  .right { display: flex; align-items: center; gap: 8px; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 700; padding: 6px 10px; border-radius: 9px; background: var(--surface-2); white-space: nowrap; }
  .timer.low { background: var(--warn-bg); color: var(--warn); }
  .timer.crit { background: var(--bad-bg); color: var(--bad); }
  main { max-width: 820px; margin: 0 auto; padding: 18px 16px 40px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
  h2 { font-size: 1.25rem; margin: 0 0 10px; line-height: 1.25; }
  h3 { font-size: 1.02rem; margin: 0 0 8px; }
  p { margin: 0 0 10px; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .chip { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: 12.5px; }
  .prompt { font-size: 1.05rem; margin-bottom: 14px; }
  .options { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
  .opt { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; padding: 12px 14px; border-radius: 10px;
         border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font: inherit; cursor: pointer; }
  .opt:hover { border-color: var(--accent); }
  .opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .opt .key { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 650; font-size: 13px; background: var(--surface-2); color: var(--muted); }
  .opt p { margin: 0; }
  input[type=text], textarea, select { width: 100%; font: inherit; color: var(--text); background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 13px; }
  select { width: auto; padding: 7px 10px; }
  textarea { min-height: 160px; resize: vertical; }
  textarea.essay { min-height: 320px; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; }
  .spacer { flex: 1; }
  .btn { border: 0; border-radius: 10px; padding: 11px 18px; background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
  .btn.secondary { background: var(--surface-2); color: var(--text); }
  .btn.flag[aria-pressed="true"] { background: var(--warn-bg); color: var(--warn); }
  .ghost { border: 1px solid var(--border); background: transparent; color: var(--text); border-radius: 10px; padding: 7px 11px; cursor: pointer; font: inherit; }
  .nav { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; margin-top: 8px; }
  .nav button { height: 38px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 13px; cursor: pointer; position: relative; }
  .nav button.answered { background: var(--accent-soft); border-color: var(--accent); }
  .nav button.current { outline: 2px solid var(--accent); outline-offset: 1px; }
  .nav button.flagged::after { content: "⚑"; position: absolute; top: -7px; right: -4px; font-size: 12px; color: var(--warn); }
  .nav button[disabled] { opacity: .45; cursor: not-allowed; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .score { font-size: 2.8rem; font-weight: 700; line-height: 1; margin: 6px 0 6px; }
  .small { font-size: 13.5px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meter { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; min-width: 60px; margin-top: 7px; }
  .meter > span { display: block; height: 100%; background: var(--accent); }
  .review { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 14px; }
  .verdict { font-weight: 700; }
  .verdict.good { color: var(--good); } .verdict.bad { color: var(--bad); } .verdict.partial { color: var(--warn); }
  .model { margin-top: 10px; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); }
  .model ul { margin: 6px 0 0; padding-left: 20px; }
  .response { white-space: pre-wrap; padding: 10px 12px; border-radius: 10px; border: 1px dashed var(--border); margin: 6px 0; }
  .source { display: block; margin-top: 6px; color: var(--muted); font-size: 13px; }
  code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .92em; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
  pre { background: var(--surface-2); padding: 12px; border-radius: 10px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  .foot { text-align: center; color: var(--muted); font-size: 12.5px; padding: 0 16px 24px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px;
           border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 5; }
  .toast.show { opacity: 1; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (max-width: 520px) { .card { padding: 16px; } .score { font-size: 2.3rem; } .btn { flex: 1 1 auto; } }
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><span class="logo" aria-hidden="true">⏱️</span>
    <div style="min-width:0"><div id="title" class="title">Mock exam</div><div id="subtitle" class="subtitle"></div></div></div>
  <div class="right"><span id="timer" class="timer" role="timer" aria-live="off" hidden></span>
    <button id="theme" class="ghost" type="button" aria-label="Switch between light and dark mode">◐</button></div>
</header>
<main id="app" tabindex="-1"></main>
<p class="foot">Studying with Claude · Practice only: scores are estimates, not official results. AI can make mistakes.</p>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="announce" class="sr" aria-live="assertive"></div>

<script type="application/json" id="exam-data">
{
  "id": "demo-mock",
  "title": "Photosynthesis: demo mock exam",
  "course": "Demo course",
  "timing": "sections",
  "instructions": "Answer every question. You won't see feedback until you submit. Flag questions to come back to them.",
  "sections": [
    { "id": "A", "name": "Section A: Multiple choice", "timeMinutes": 6,
      "questions": [
        { "id": "a1", "type": "mcq", "topic": "light-reactions", "points": 1, "prompt": "Which product of the light-dependent reactions is released into the air?",
          "options": ["Glucose", "Oxygen", "Carbon dioxide", "NADPH"], "answer": 1, "explanation": "Oxygen from split water leaves the leaf.", "source": "[S1 ¶6]" },
        { "id": "a2", "type": "mcq", "topic": "calvin-cycle", "points": 1, "prompt": "Rubisco attaches CO₂ to which molecule?",
          "options": ["Glucose", "G3P", "RuBP", "ATP"], "answer": 2, "explanation": "Carbon fixation joins CO₂ to RuBP.", "source": "[S1 ¶7]" },
        { "id": "a3", "type": "tf", "topic": "calvin-cycle", "points": 1, "prompt": "The Calvin cycle can continue for long in permanent darkness.",
          "answer": false, "explanation": "It depends on ATP and NADPH from the light-dependent reactions, which stop in the dark.", "source": "[S1 ¶7]" }
      ] },
    { "id": "B", "name": "Section B: Written answers", "timeMinutes": 10,
      "questions": [
        { "id": "b1", "type": "short", "topic": "light-reactions", "points": 3, "prompt": "Describe how light energy ends up stored in ATP and NADPH. (3 marks)",
          "modelAnswer": "Chlorophyll absorbs light and its electrons are excited; they pass along an electron transport chain in the thylakoid membrane, which pumps protons; the proton gradient drives ATP synthase; the electrons finally reduce NADP⁺ to NADPH.",
          "rubric": [ { "point": "Light excites electrons in chlorophyll", "marks": 1 }, { "point": "Electron transport builds a proton gradient that drives ATP synthase", "marks": 1 }, { "point": "Electrons reduce NADP+ to NADPH", "marks": 1 } ],
          "source": "[S1 ¶5]" }
      ] }
  ],
  "bands": [ { "min": 85, "label": "Ready" }, { "min": 70, "label": "Nearly there" }, { "min": 0, "label": "Needs more practice" } ]
}
</script>

<script>
(function () {
  "use strict";
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var app = $("#app"), timerEl = $("#timer");
  var store = {
    get: function (k, f) { try { var v = localStorage.getItem(k); return v === null ? f : JSON.parse(v); } catch (e) { return f; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* keep going without saving */ } },
    remove: function (k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
  };
  var root = document.documentElement;
  function applyTheme(t) { if (t === "light" || t === "dark") root.setAttribute("data-theme", t); else root.removeAttribute("data-theme"); }
  applyTheme(store.get("swc-theme", null));
  $("#theme").addEventListener("click", function () {
    var dark = root.getAttribute("data-theme") ? root.getAttribute("data-theme") === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    applyTheme(dark ? "light" : "dark"); store.set("swc-theme", dark ? "light" : "dark");
  });

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function md(src) {
    var stash = []; function keep(h) { return "\u0000" + (stash.push(h) - 1) + "\u0000"; }
    var s = String(src == null ? "" : src);
    s = s.replace(/```[\w-]*\n?([\s\S]*?)```/g, function (_, c) { return keep("<pre><code>" + esc(c.replace(/\n$/, "")) + "</code></pre>"); });
    s = s.replace(/\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|\$[^$\n]+?\$/g, function (m) { return keep(esc(m)); });
    s = s.replace(/`([^`\n]+)`/g, function (_, c) { return keep("<code>" + esc(c) + "</code>"); });
    s = esc(s).replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    return s.split(/\n{2,}/).map(function (b) {
      var lines = b.split("\n");
      if (/^\u0000\d+\u0000$/.test(b.trim())) return b;
      if (lines.every(function (l) { return /^\s*[-•]\s+/.test(l); })) return "<ul>" + lines.map(function (l) { return "<li>" + l.replace(/^\s*[-•]\s+/, "") + "</li>"; }).join("") + "</ul>";
      return "<p>" + lines.join("<br>") + "</p>";
    }).join("").replace(/\u0000(\d+)\u0000/g, function (_, i) { return stash[+i]; });
  }
  function mdInline(s) { var h = md(s), m = h.match(/^<p>([\s\S]*)<\/p>$/); return m && m[1].indexOf("<p>") < 0 ? m[1] : h; }
  function plain(s) { return String(s == null ? "" : s).replace(/\*\*|`/g, ""); }

  var raw = $("#exam-data").textContent, USES_MATH = /\$[^$\n]+\$|\\\(|\\\[/.test(raw), mathState = "idle";
  function loadScript(u) { return new Promise(function (ok, no) { var s = document.createElement("script"); s.src = u; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
  function typeset() {
    if (!USES_MATH) return;
    if (mathState === "ready") { try { window.renderMathInElement(app, { throwOnError: false, delimiters: [{ left: "$$", right: "$$", display: true }, { left: "\\[", right: "\\]", display: true }, { left: "$", right: "$", display: false }, { left: "\\(", right: "\\)", display: false }] }); } catch (e) { /* raw TeX */ } return; }
    if (mathState !== "idle") return; mathState = "loading";
    var base = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/", css = document.createElement("link");
    css.rel = "stylesheet"; css.href = base + "katex.min.css"; document.head.appendChild(css);
    loadScript(base + "katex.min.js").then(function () { return loadScript(base + "contrib/auto-render.min.js"); }).then(function () { mathState = "ready"; typeset(); }, function () { mathState = "failed"; });
  }

  var exam;
  try { exam = JSON.parse(raw); } catch (e) { app.innerHTML = '<div class="card"><h2>This exam file is damaged</h2><p>' + esc(e.message) + "</p><p>Ask Claude to regenerate it.</p></div>"; return; }
  var sections = (exam.sections || []).map(function (s, i) { return { id: String(s.id || "S" + (i + 1)), name: s.name || "Section " + (i + 1), timeMinutes: s.timeMinutes, instructions: s.instructions, questions: s.questions || [] }; });
  var all = [], byId = {};
  sections.forEach(function (sec, si) {
    sec.questions.forEach(function (q, qi) {
      var copy = {}; for (var k in q) copy[k] = q[k];
      copy.id = String(q.id || sec.id + "-" + (qi + 1)); copy.section = si; copy.points = +q.points || (q.rubric ? q.rubric.reduce(function (s, r) { return s + (+r.marks || 1); }, 0) : 1);
      all.push(copy); byId[copy.id] = copy;
    });
  });
  var BY_SECTION = exam.timing === "sections" && sections.every(function (s) { return s.timeMinutes > 0; });
  var TOTAL_MIN = BY_SECTION ? sections.reduce(function (s, x) { return s + x.timeMinutes; }, 0) : (+exam.timeLimitMinutes || 0);
  var totalPoints = all.reduce(function (s, q) { return s + q.points; }, 0);
  document.title = exam.title || "Mock exam";
  $("#title").textContent = exam.title || "Mock exam";
  $("#subtitle").textContent = [exam.course, all.length + " questions", TOTAL_MIN ? TOTAL_MIN + " min" : "untimed"].filter(Boolean).join(" · ");

  var KEY = "swc-mock-" + (exam.id || exam.title || "exam");
  function fresh() { return { phase: "start", sec: 0, pos: 0, answers: {}, flags: {}, ends: {}, used: {}, startedAt: null, submittedAt: null, marks: {}, timedOut: false }; }
  var st = store.get(KEY, null);
  if (!st || !st.phase) st = fresh();
  function save() { store.set(KEY, st); }
  function localIso(d) { d = d || new Date(); var p = function (n) { return String(n).padStart(2, "0"); }; return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds()); }
  function isOpen(q) { return q.type === "short" || q.type === "significance" || q.type === "essay"; }
  function topicName(id) { return id ? String(id).replace(/[-_]+/g, " ").replace(/^\w/, function (c) { return c.toUpperCase(); }) : "General"; }
  function questionsIn(si) { return all.filter(function (q) { return BY_SECTION ? q.section === si : true; }); }
  function answered(q) { var a = st.answers[q.id]; return a !== undefined && a !== null && a !== ""; }

  // ---------- timer
  var tick = null, warned = {};
  function clockKey() { return BY_SECTION ? sections[st.sec].id : "_total"; }
  function startClock() {
    if (!TOTAL_MIN) return;
    var k = clockKey();
    if (!st.ends[k]) { st.ends[k] = Date.now() + (BY_SECTION ? sections[st.sec].timeMinutes : TOTAL_MIN) * 60000; st.used[k] = st.used[k] || 0; save(); }
    timerEl.hidden = false;
    clearInterval(tick); tick = setInterval(updateClock, 1000); updateClock();
  }
  function updateClock() {
    var k = clockKey(), left = Math.max(0, st.ends[k] - Date.now());
    var m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
    timerEl.textContent = (BY_SECTION ? sections[st.sec].id + " · " : "") + m + ":" + String(s).padStart(2, "0");
    timerEl.className = "timer" + (left <= 60000 ? " crit" : left <= 300000 ? " low" : "");
    timerEl.setAttribute("aria-label", m + " minutes " + s + " seconds left");
    [300000, 60000].forEach(function (w) { if (left <= w && left > w - 2000 && !warned[k + w]) { warned[k + w] = true; $("#announce").textContent = (w / 60000) + " minute" + (w > 60000 ? "s" : "") + " left"; } });
    if (left <= 0) { clearInterval(tick); timeUp(); }
  }
  function stopClock() { clearInterval(tick); timerEl.hidden = true; }
  function timeUp() {
    toast(BY_SECTION && st.sec < sections.length - 1 ? "Time's up for this section. Moving on." : "Time's up. Your exam was submitted.");
    st.timedOut = true; finishSection();
  }
  function finishSection() {
    var k = clockKey();
    if (TOTAL_MIN && st.ends[k]) st.used[k] = Math.min((BY_SECTION ? sections[st.sec].timeMinutes : TOTAL_MIN) * 60000, (BY_SECTION ? sections[st.sec].timeMinutes : TOTAL_MIN) * 60000 - Math.max(0, st.ends[k] - Date.now()));
    if (BY_SECTION && st.sec < sections.length - 1) { st.sec++; st.pos = 0; save(); startClock(); render(); }
    else submit();
  }
  function submit() {
    stopClock(); st.submittedAt = localIso();
    st.phase = all.some(isOpen) ? "grading" : "results"; save(); render(); app.focus();
  }

  // ---------- screens
  function render() {
    if (st.phase === "start") renderStart();
    else if (st.phase === "exam") { renderQuestion(); }
    else if (st.phase === "grading") renderGrading();
    else renderResults();
    typeset();
  }

  function renderStart() {
    var rows = sections.map(function (s, i) {
      return "<tr><td>" + esc(s.name) + '</td><td class="num">' + (BY_SECTION ? questionsIn(i).length : s.questions.length) + '</td><td class="num">' + (s.timeMinutes ? s.timeMinutes + " min" : "–") + "</td></tr>";
    }).join("");
    app.innerHTML = '<div class="card"><h2>' + esc(exam.title || "Mock exam") + "</h2>" + (exam.instructions ? md(exam.instructions) : "") +
      '<table><thead><tr><th>Section</th><th class="num">Questions</th><th class="num">Time</th></tr></thead><tbody>' + rows + "</tbody></table>" +
      '<ul class="small" style="margin:14px 0 0;padding-left:18px">' +
      (TOTAL_MIN ? "<li>The clock starts when you press Start and keeps running if you close the page.</li>" : "<li>This exam is untimed.</li>") +
      (BY_SECTION ? "<li>Each section has its own time. When you move on, or its time runs out, you can't go back to it.</li>" : "<li>You can move between questions freely and flag them to revisit.</li>") +
      "<li>No feedback until you submit. Then you get your score with a breakdown.</li><li>Work like it's the real exam: no notes unless the real exam allows them.</li></ul>" +
      '<div class="actions"><button class="btn" id="go" type="button">Start exam</button></div></div>';
    $("#go").addEventListener("click", function () { st = fresh(); st.phase = "exam"; st.startedAt = localIso(); save(); startClock(); render(); });
    $("#go").focus();
  }

  function renderQuestion() {
    var list = questionsIn(st.sec), q = list[st.pos], sec = sections[q.section], a = st.answers[q.id];
    var html = '<div class="card"><div class="meta"><span>' + esc(sec.name) + "</span><span>Question " + (st.pos + 1) + " of " + list.length + '</span><span class="chip">' +
      q.points + " point" + (q.points === 1 ? "" : "s") + "</span></div>" +
      (st.pos === 0 && sec.instructions ? '<div class="small">' + md(sec.instructions) + "</div>" : "") +
      '<div class="prompt" id="prompt">' + md(q.prompt) + "</div>";
    if (q.type === "mcq" || q.type === "tf") {
      var values = q.type === "tf" ? [true, false] : q.options.map(function (_, i) { return i; });
      html += '<ul class="options" role="radiogroup" aria-labelledby="prompt">' + values.map(function (v, i) {
        var lab = q.type === "tf" ? (v ? "True" : "False") : q.options[i];
        return '<li><button type="button" class="opt" role="radio" data-i="' + i + '" aria-checked="' + (a === v ? "true" : "false") + '"><span class="key">' +
          (q.type === "tf" ? (v ? "T" : "F") : String.fromCharCode(65 + i)) + "</span><span>" + mdInline(lab) + "</span></button></li>";
      }).join("") + "</ul>";
    } else if (q.type === "fill") {
      html += '<label class="sr" for="ans">Your answer</label><input type="text" id="ans" autocomplete="off" placeholder="Type your answer" value="' + esc(a || "") + '">';
    } else {
      html += '<label class="sr" for="ans">Your answer</label><textarea id="ans" class="' + (q.type === "essay" ? "essay" : "") + '" placeholder="Write your answer">' + esc(a || "") + "</textarea>";
    }
    var last = st.pos === list.length - 1;
    html += '<div class="actions"><button class="btn secondary" id="prev" type="button"' + (st.pos === 0 ? " disabled" : "") + '>Back</button>' +
      '<button class="btn secondary flag" id="flag" type="button" aria-pressed="' + (st.flags[q.id] ? "true" : "false") + '">⚑ ' + (st.flags[q.id] ? "Flagged" : "Flag") + "</button>" +
      '<span class="spacer"></span>' +
      (last ? '<button class="btn" id="finish" type="button">' + (BY_SECTION && st.sec < sections.length - 1 ? "Finish section" : "Submit exam") + "</button>"
            : '<button class="btn" id="next" type="button">Next</button>') + "</div>" +
      '<h3 style="margin-top:18px">Questions</h3><div class="nav" id="nav"></div><div class="legend"><span>■ answered</span><span>⚑ flagged</span></div></div>';
    app.innerHTML = html;

    app.querySelectorAll(".opt").forEach(function (b) {
      b.addEventListener("click", function () {
        var i = +b.getAttribute("data-i"); st.answers[q.id] = q.type === "tf" ? i === 0 : i; save();
        app.querySelectorAll(".opt").forEach(function (o) { o.setAttribute("aria-checked", o === b ? "true" : "false"); }); drawNav();
      });
    });
    var input = $("#ans");
    if (input) { input.addEventListener("input", function () { st.answers[q.id] = input.value; save(); drawNav(); }); }
    $("#prev").addEventListener("click", function () { st.pos--; save(); render(); });
    $("#flag").addEventListener("click", function () { st.flags[q.id] = !st.flags[q.id]; save(); render(); });
    if (last) $("#finish").addEventListener("click", function () {
      var missing = list.filter(function (x) { return !answered(x); }).length, flagged = list.filter(function (x) { return st.flags[x.id]; }).length;
      var msg = (BY_SECTION && st.sec < sections.length - 1 ? "Finish this section? You can't come back to it." : "Submit your exam?") +
        (missing ? "\n" + missing + " question(s) unanswered." : "") + (flagged ? "\n" + flagged + " question(s) flagged." : "");
      if (window.confirm(msg)) finishSection();
    });
    else $("#next").addEventListener("click", function () { st.pos++; save(); render(); });
    drawNav();

    function drawNav() {
      var nav = $("#nav"); nav.innerHTML = "";
      list.forEach(function (x, i) {
        var b = document.createElement("button"); b.type = "button"; b.textContent = String(i + 1);
        b.className = (answered(x) ? "answered " : "") + (st.flags[x.id] ? "flagged " : "") + (i === st.pos ? "current" : "");
        b.setAttribute("aria-label", "Question " + (i + 1) + (answered(x) ? ", answered" : ", not answered") + (st.flags[x.id] ? ", flagged" : ""));
        b.addEventListener("click", function () { st.pos = i; save(); render(); });
        nav.appendChild(b);
      });
    }
  }

  // ---------- grading
  function norm(s) { return String(s == null ? "" : s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").replace(/^[\s"'“”‘’.,;:!?()]+|[\s"'“”‘’.,;:!?()]+$/g, "").trim(); }
  function autoMark(q) {
    var a = st.answers[q.id];
    if (q.type === "mcq" || q.type === "tf") return a === q.answer ? q.points : 0;
    if (q.type === "fill") { var acc = (Array.isArray(q.answer) ? q.answer : [q.answer]).map(norm); return acc.indexOf(norm(a)) >= 0 ? q.points : 0; }
    return null;
  }
  function answerText(q) {
    if (q.type === "mcq") return plain(q.options[q.answer]);
    if (q.type === "tf") return q.answer ? "True" : "False";
    if (q.type === "fill") return String(Array.isArray(q.answer) ? q.answer[0] : q.answer);
    return plain(q.modelAnswer || "");
  }
  function responseText(q) {
    var a = st.answers[q.id];
    if (a === undefined || a === null || a === "") return "(no answer)";
    if (q.type === "mcq") return plain(q.options[a]);
    if (q.type === "tf") return a ? "True" : "False";
    return String(a);
  }
  function earned(q) { var m = autoMark(q); return m !== null ? m : (st.marks[q.id] == null ? null : +st.marks[q.id]); }

  function renderGrading() {
    var open = all.filter(isOpen);
    var html = '<div class="card"><h2>Mark your written answers</h2><p>Compare each answer with the mark scheme and give yourself the marks you honestly earned. ' +
      "For a stricter, independent grade, copy them to Claude, then enter the marks it gives you.</p>" +
      '<div class="actions" style="margin-top:4px"><button class="btn secondary" id="copy-open" type="button">Copy written answers for Claude</button></div></div>';
    open.forEach(function (q, i) {
      var steps = []; for (var v = 0; v <= q.points + 1e-9; v += q.points <= 4 ? 0.5 : 1) steps.push(Math.round(v * 2) / 2);
      html += '<div class="card"><div class="meta"><span>' + esc(sections[q.section].name) + '</span><span class="chip">' + q.points + " points</span></div>" + md(q.prompt) +
        '<div class="small">Your answer:</div><div class="response">' + esc(responseText(q)) + "</div>" +
        '<div class="model"><strong>Mark scheme</strong>' + (q.rubric ? "<ul>" + q.rubric.map(function (r) { return "<li>" + mdInline(r.point) + " (" + (r.marks || 1) + ")</li>"; }).join("") + "</ul>" : "") +
        (q.keyPoints ? "<ul>" + q.keyPoints.map(function (k) { return "<li>" + mdInline(k) + "</li>"; }).join("") + "</ul>" : "") +
        (q.modelAnswer ? "<p style=\"margin-top:8px\"><strong>Model answer:</strong></p>" + md(q.modelAnswer) : "") + "</div>" +
        '<div class="actions"><label for="m' + i + '">Marks earned</label><select id="m' + i + '" data-q="' + esc(q.id) + '"><option value="">Choose</option>' +
        steps.map(function (v) { return '<option value="' + v + '"' + (st.marks[q.id] != null && +st.marks[q.id] === v ? " selected" : "") + ">" + v + " / " + q.points + "</option>"; }).join("") + "</select></div></div>";
    });
    html += '<div class="card"><div class="actions"><button class="btn" id="see" type="button">See my results</button></div></div>';
    app.innerHTML = html;
    app.querySelectorAll("select[data-q]").forEach(function (s) { s.addEventListener("change", function () { st.marks[s.getAttribute("data-q")] = s.value === "" ? null : +s.value; save(); }); });
    $("#copy-open").addEventListener("click", function () {
      var payload = open.map(function (q) { return { id: q.id, points: q.points, prompt: plain(q.prompt), rubric: q.rubric || q.keyPoints || null, modelAnswer: q.modelAnswer || null, response: responseText(q) }; });
      copy("Please grade my written mock exam answers strictly against the mark scheme and tell me the marks for each, with reasons.\n\n```json\n" + JSON.stringify(payload, null, 2) + "\n```");
    });
    $("#see").addEventListener("click", function () {
      var missing = open.filter(function (q) { return st.marks[q.id] == null; }).length;
      if (missing && !window.confirm(missing + " written answer(s) not marked yet. They will count as 0. Continue?")) return;
      open.forEach(function (q) { if (st.marks[q.id] == null) st.marks[q.id] = 0; });
      st.phase = "results"; save(); render(); app.focus();
    });
  }

  // ---------- results
  function group(keyFn) {
    var g = {};
    all.forEach(function (q) { var k = keyFn(q); g[k] = g[k] || { earned: 0, points: 0, n: 0 }; g[k].earned += earned(q) || 0; g[k].points += q.points; g[k].n++; });
    return g;
  }
  function pct(e, p) { return p ? Math.round(100 * e / p) : 0; }
  function table(title, g, labelFn) {
    var column = title.replace(/^By /, ""); column = column.charAt(0).toUpperCase() + column.slice(1);
    return "<h3 style=\"margin-top:16px\">" + esc(title) + '</h3><table><thead><tr><th>' + esc(column) + '</th><th class="num">Score</th><th style="width:34%"></th></tr></thead><tbody>' +
      Object.keys(g).map(function (k) { var x = g[k], p = pct(x.earned, x.points); return "<tr><td>" + esc(labelFn(k)) + '</td><td class="num">' + x.earned + "/" + x.points + " (" + p + '%)</td><td><div class="meter" role="img" aria-label="' + p + ' percent"><span style="width:' + p + '%"></span></div></td></tr>'; }).join("") +
      "</tbody></table>";
  }
  function fmtTime(ms) { return ms < 60000 ? "under 1 min" : Math.round(ms / 60000) + " min"; }

  function renderResults() {
    var got = all.reduce(function (s, q) { return s + (earned(q) || 0); }, 0), p = pct(got, totalPoints);
    var band = (exam.bands || []).slice().sort(function (a, b) { return b.min - a.min; }).filter(function (b) { return p >= b.min; })[0];
    var typeNames = { mcq: "Multiple choice", tf: "True/false", fill: "Fill in the blank", short: "Short answer", significance: "Explain the significance", essay: "Essay / extended" };
    var html = '<div class="card"><h2>Your result</h2><div class="score">' + p + '%</div><p class="small">' + got + " of " + totalPoints + " points" +
      (band ? " · " + esc(band.label) + " (estimate)" : "") + (st.timedOut ? " · time ran out" : "") + "</p>";
    if (TOTAL_MIN) {
      html += '<p class="small">Time used: ' + (BY_SECTION ? sections.map(function (s) { return esc(s.id) + " " + fmtTime(st.used[s.id] || 0) + " of " + s.timeMinutes + " min"; }).join(" · ")
        : fmtTime(st.used._total || 0) + " of " + TOTAL_MIN + " min") + "</p>";
    }
    html += table("By section", group(function (q) { return String(q.section); }), function (k) { return sections[+k].name; }) +
      table("By topic", group(function (q) { return q.topic || "general"; }), topicName) +
      table("By question type", group(function (q) { return q.type; }), function (k) { return typeNames[k] || k; }) +
      '<div class="actions"><button class="btn" id="copy" type="button">Copy results for Claude</button><button class="btn secondary" id="dl" type="button">Download results</button>' +
      '<button class="btn secondary" id="retake" type="button">Retake</button></div>' +
      '<p class="small" style="margin-top:10px">Paste the results back to Claude to log them, update your error log, and plan what to review.</p></div>';

    html += '<div class="card"><h2>Review every question</h2>';
    all.forEach(function (q, i) {
      var e = earned(q) || 0, cls = e >= q.points ? "good" : e > 0 ? "partial" : "bad", label = e >= q.points ? "✓ Full marks" : e > 0 ? "◐ Partial" : "✗ No marks";
      html += '<div class="review"><div class="meta"><span>Q' + (i + 1) + " · " + esc(sections[q.section].id) + '</span><span class="chip">' + esc(topicName(q.topic)) + '</span><span class="verdict ' + cls + '">' + label + " (" + e + "/" + q.points + ")</span></div>" +
        md(q.prompt) + '<div class="small">Your answer:</div><div class="response">' + esc(responseText(q)) + "</div>" +
        (isOpen(q) ? (q.modelAnswer ? '<div class="model"><strong>Model answer</strong>' + md(q.modelAnswer) + "</div>" : "") : "<p><strong>Answer:</strong> " + esc(answerText(q)) + "</p>") +
        (q.explanation ? md(q.explanation) : "") + (q.source ? '<span class="source">Source: ' + esc(q.source) + "</span>" : "") + "</div>";
    });
    html += "</div>";
    app.innerHTML = html;
    $("#copy").addEventListener("click", function () { copy("Here are my mock exam results. Please log them, update my error log, and tell me what to review.\n\n```json\n" + JSON.stringify(results(), null, 2) + "\n```"); });
    $("#dl").addEventListener("click", function () {
      var blob = new Blob([JSON.stringify(results(), null, 2)], { type: "application/json" }), link = document.createElement("a");
      link.href = URL.createObjectURL(blob); link.download = (exam.id || "mock-exam") + "-results.json"; document.body.appendChild(link); link.click();
      setTimeout(function () { URL.revokeObjectURL(link.href); link.remove(); }, 500);
    });
    $("#retake").addEventListener("click", function () { if (window.confirm("Start the exam again from scratch?")) { store.remove(KEY); st = fresh(); render(); } });
  }

  function results() {
    var got = all.reduce(function (s, q) { return s + (earned(q) || 0); }, 0);
    return {
      exam: exam.id || null, title: exam.title || null, course: exam.course || null, started: st.startedAt, submitted: st.submittedAt, timedOut: !!st.timedOut,
      score: { earned: got, total: totalPoints, percent: pct(got, totalPoints) },
      timeUsedMinutes: Object.keys(st.used).reduce(function (o, k) { o[k] = Math.round((st.used[k] || 0) / 600) / 100; return o; }, {}),
      answers: all.map(function (q) {
        var e = earned(q) || 0;
        return { id: q.id, section: sections[q.section].id, topic: q.topic || null, type: q.type, points: q.points, earned: e,
                 correct: e >= q.points ? true : e > 0 ? "partial" : false, prompt: plain(q.prompt), response: responseText(q), answer: answerText(q), source: q.source || null };
      })
    };
  }

  function toast(m) { var t = $("#toast"); t.textContent = m; t.classList.add("show"); setTimeout(function () { t.classList.remove("show"); }, 2600); }
  function copy(text) {
    function fallback() { var a = document.createElement("textarea"); a.value = text; a.style.position = "fixed"; a.style.opacity = "0"; document.body.appendChild(a); a.select(); var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; } a.remove(); toast(ok ? "Copied. Paste it into your chat with Claude." : "Couldn't copy. Use Download results instead."); }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { toast("Copied. Paste it into your chat with Claude."); }, fallback); else fallback();
  }

  if (st.phase === "exam") { startClock(); }
  render();
})();
</script>
</body>
</html>
