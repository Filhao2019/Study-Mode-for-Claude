    s = s.replace(/`([^`\n]+)`/g, function (_, c) { return keep("<code>" + esc(c) + "</code>"); });

      .then(function () { mathState = "ready"; typeset(); })
      .catch(function () { mathState = "failed"; });
  }

  // ---------- data
  var data;
  try { data = JSON.parse(rawData); } catch (e) {
    app.innerHTML = '<div class="card"><h2>This quiz file is damaged</h2><p>The quiz data could not be read: ' + esc(e.message) + "</p><p>Ask Claude to regenerate it.</p></div>";
    return;
  }
  var questions = (data.questions || []).map(function (q, i) { var c = {}; for (var k in q) c[k] = q[k]; c.id = q.id || "q" + (i + 1); return c; });
  var byId = {}; questions.forEach(function (q) { byId[q.id] = q; });
  var KEY = "swc-quiz-" + (data.id || data.title || "untitled");
  document.title = (data.title || "Practice quiz");
  $("#title").textContent = data.title || "Practice quiz";
  $("#subtitle").textContent = [data.course, questions.length + " questions"].filter(Boolean).join(" · ");

  function topicName(id) {
    if (!id) return "General";
    if (data.topics && data.topics[id]) return data.topics[id];
    return String(id).replace(/[-_]+/g, " ").replace(/^\w/, function (c) { return c.toUpperCase(); });
  }
  function localIso(d) {
    d = d || new Date();
    var p = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }
  function shuffled(list) { var a = list.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  // ---------- state
  function freshState() {
    var ids = questions.map(function (q) { return q.id; });
    return { started: false, finished: false, order: data.shuffle ? shuffled(ids) : ids, pos: 0, answers: {}, first: {}, pass: 1, startedAt: null, finishedAt: null };
  }
  var state = store.get(KEY, null);
  if (!state || !Array.isArray(state.order) || state.order.some(function (id) { return !byId[id]; })) state = freshState();
  function save() { store.set(KEY, state); }

  // ---------- grading
  function norm(s) {
    return String(s == null ? "" : s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
      .replace(/\s+/g, " ").replace(/^[\s"'“”‘’.,;:!?()]+|[\s"'“”‘’.,;:!?()]+$/g, "").trim();
  }
  function accepted(q) { return (Array.isArray(q.answer) ? q.answer : [q.answer]).map(String); }
  function answerText(q) {
    if (q.type === "mcq") return q.options ? plain(q.options[q.answer]) : String(q.answer);
    if (q.type === "tf") return q.answer ? "True" : "False";
    if (q.type === "fill") return accepted(q)[0];
    return plain(q.modelAnswer || "");
  }
  function isOpen(q) { return q.type === "short" || q.type === "significance"; }
  function grade(q, response) {
    if (q.type === "mcq") return response === q.answer;
    if (q.type === "tf") return response === q.answer;
    if (q.type === "fill") { var r = norm(response); return accepted(q).some(function (a) { return norm(a) === r; }); }
    return null; // open questions are self-graded
  }
  function record(q, response, correct) {
    state.answers[q.id] = { response: response, correct: correct };
    if (!(q.id in state.first)) state.first[q.id] = correct;
    save();
  }

  // ---------- screens
  function setProgress() {
    var total = state.order.length || 1;
    var done = state.finished ? total : state.order.filter(function (id) { return state.answers[id] && state.answers[id].correct !== undefined; }).length;
    $("#progress-fill").style.width = Math.round(100 * done / total) + "%";
  }

  function render() {
    setProgress();
    if (!questions.length) { app.innerHTML = '<div class="card"><h2>No questions yet</h2><p>This quiz has no questions.</p></div>'; return; }
    if (state.finished) renderResults();
    else if (!state.started) renderStart();
    else renderQuestion();
    typeset();
  }

  function renderStart() {
    var topics = {};
    questions.forEach(function (q) { topics[topicName(q.topic)] = true; });
    var resumable = Object.keys(state.answers).length > 0;
    app.innerHTML =
      '<div class="card"><h2>' + esc(data.title || "Practice quiz") + "</h2>" +
      (data.instructions ? md(data.instructions) : "") +
      '<p class="small">' + questions.length + " questions · Topics: " + esc(Object.keys(topics).join(", ")) + "</p>" +
      '<div class="actions"><button class="btn" id="go" type="button">' + (resumable ? "Resume" : "Start quiz") + "</button>" +
      (resumable ? '<button class="btn secondary" id="restart" type="button">Start over</button>' : "") + "</div></div>";
    $("#go").addEventListener("click", function () { state.started = true; state.startedAt = state.startedAt || localIso(); save(); render(); });
    if (resumable) $("#restart").addEventListener("click", function () { state = freshState(); state.started = true; state.startedAt = localIso(); save(); render(); });
    $("#go").focus();
  }

  function renderQuestion() {
    var q = byId[state.order[state.pos]];
    var a = state.answers[q.id];
    var checked = a && a.correct !== undefined;
    var dots = q.difficulty ? '<span class="chip" title="Difficulty">' + "●".repeat(q.difficulty) + "○".repeat(Math.max(0, 4 - q.difficulty)) + "</span>" : "";
    var html = '<div class="card"><div class="meta"><span>Question ' + (state.pos + 1) + " of " + state.order.length +
      (state.pass > 1 ? " · retry" : "") + '</span><span class="chip">' + esc(topicName(q.topic)) + "</span>" + dots + "</div>" +
      '<div class="prompt" id="prompt">' + md(q.prompt) + "</div>";

    if (q.type === "mcq" || q.type === "tf") {
      var opts = q.type === "tf" ? [true, false] : q.options.map(function (_, i) { return i; });
      html += '<ul class="options" role="radiogroup" aria-labelledby="prompt">';
      opts.forEach(function (value, i) {
        var label = q.type === "tf" ? (value ? "True" : "False") : q.options[i];
        var cls = "opt";
        if (checked) { if (value === q.answer) cls += " correct"; else if (a.response === value) cls += " wrong"; }
        html += '<li><button type="button" class="' + cls + '" role="radio" data-i="' + i + '" aria-checked="' + (a && a.response === value ? "true" : "false") + '"' +
          (checked ? " disabled" : "") + '><span class="key">' + (q.type === "tf" ? (value ? "T" : "F") : String.fromCharCode(65 + i)) + "</span><span>" + mdInline(label) + "</span></button></li>";
      });
      html += "</ul>";
    } else if (q.type === "fill") {
      html += '<label class="sr" for="fill">Your answer</label><input type="text" id="fill" autocomplete="off" placeholder="Type your answer" value="' + esc(a ? a.response : "") + '"' + (checked ? " disabled" : "") + ">";
    } else {
      html += '<label class="sr" for="open">Your answer</label><textarea id="open" placeholder="Write your answer in your own words"' + (a && a.revealed ? " disabled" : "") + ">" + esc(a ? a.response : "") + "</textarea>";
    }

    if (q.hint && !checked) html += '<div id="hint-box"></div>';
    html += '<div id="feedback" aria-live="polite"></div><div class="actions" id="actions"></div></div>';
    app.innerHTML = html;

    var selected = a ? a.response : undefined;
    var actions = $("#actions");
    function button(label, cls, fn, disabled) {
      var b = document.createElement("button"); b.type = "button"; b.className = cls; b.textContent = label; b.disabled = !!disabled;
      b.addEventListener("click", fn); actions.appendChild(b); return b;
    }

    if (q.type === "mcq" || q.type === "tf") {
      app.querySelectorAll(".opt").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var i = +btn.getAttribute("data-i");
          selected = q.type === "tf" ? i === 0 : i;
          app.querySelectorAll(".opt").forEach(function (o) { o.setAttribute("aria-checked", o === btn ? "true" : "false"); });
          if (checkBtn) checkBtn.disabled = false;
        });
      });
    }

    var checkBtn = null;
    if (!checked) {
      if (isOpen(q)) {
        if (a && a.revealed) showModel(q);
        else checkBtn = button("Show model answer", "btn", function () {
          var text = $("#open").value.trim();
          state.answers[q.id] = { response: text, revealed: true }; save(); renderQuestion(); typeset();
        });
      } else {
        checkBtn = button("Check answer", "btn", function () {
          var response = q.type === "fill" ? $("#fill").value.trim() : selected;
          if (response === undefined || response === "") return;
          record(q, response, grade(q, response)); renderQuestion(); typeset(); setProgress();
        }, q.type !== "fill" && selected === undefined);
        if (q.type === "fill") {
          $("#fill").addEventListener("keydown", function (e) { if (e.key === "Enter") checkBtn.click(); });
          $("#fill").focus();
        }
      }
      if (q.hint && !(a && a.revealed)) {
        button("Hint", "btn secondary", function (e) {
          $("#hint-box").innerHTML = '<div class="hint">💡 ' + md(q.hint) + "</div>"; e.target.remove(); typeset();
        });
      }
    } else {
      showFeedback(q, a);
    }

    if (state.pos > 0) button("Back", "btn secondary", function () { state.pos--; save(); render(); });
    if (checked) {
      var last = state.pos === state.order.length - 1;
      var next = button(last ? "See results" : "Next question", "btn", function () {
        if (last) { state.finished = true; state.finishedAt = localIso(); } else state.pos++;
        save(); render(); app.focus();
      });
      next.focus();
    }

    function showModel(q) {
      var box = document.createElement("div"); box.className = "model";
      box.innerHTML = "<strong>Model answer</strong>" + md(q.modelAnswer || "") +
        (q.keyPoints && q.keyPoints.length ? '<strong>A full answer includes:</strong><ul>' + q.keyPoints.map(function (k) { return "<li>" + mdInline(k) + "</li>"; }).join("") + "</ul>" : "") +
        '<p class="small" style="margin-top:10px">Compare honestly with what you wrote, then mark yourself.</p>';
      $("#feedback").appendChild(box);
      [["Got it", true], ["Partly", "partial"], ["Missed it", false]].forEach(function (pair) {
        button(pair[0], pair[1] === true ? "btn" : "btn secondary", function () {
          record(q, state.answers[q.id].response, pair[1]); state.answers[q.id].revealed = true; save(); renderQuestion(); typeset(); setProgress();
        });
      });
    }
  }

  function showFeedback(q, a) {
    var cls = a.correct === true ? "good" : a.correct === "partial" ? "partial" : "bad";
    var verdict = a.correct === true ? "✓ Correct" : a.correct === "partial" ? "◐ Partly right" : "✗ Not quite";
    var html = '<div class="feedback ' + cls + '"><strong class="verdict">' + verdict + "</strong>";
    if (a.correct !== true && !isOpen(q)) html += "<p>Answer: <strong>" + esc(answerText(q)) + "</strong></p>";
    if (isOpen(q)) {
      html += "<p><strong>Model answer:</strong></p>" + md(q.modelAnswer || "");
      if (q.keyPoints && q.keyPoints.length) html += '<ul>' + q.keyPoints.map(function (k) { return "<li>" + mdInline(k) + "</li>"; }).join("") + "</ul>";
    }
    if (q.explanation) html += md(q.explanation);
    if (q.source) html += '<span class="source">Source: ' + esc(q.source) + "</span>";
    $("#feedback").innerHTML = html + "</div>";
  }

  function scoreOf(ids, from) {
    var c = 0, p = 0;
    ids.forEach(function (id) { var r = from[id]; if (r === true) c++; else if (r === "partial") p++; });
    return { correct: c, partial: p, total: ids.length, points: c + p / 2, percent: ids.length ? Math.round(100 * (c + p / 2) / ids.length) : 0 };
  }

  function renderResults() {
    var ids = questions.map(function (q) { return q.id; });
    var first = scoreOf(ids, state.first);
    var latest = {}; ids.forEach(function (id) { latest[id] = state.answers[id] ? state.answers[id].correct : undefined; });
    var topics = {};
    questions.forEach(function (q) {
      var t = topicName(q.topic); topics[t] = topics[t] || { ids: [] }; topics[t].ids.push(q.id);
    });
    var missed = questions.filter(function (q) { return latest[q.id] !== true; });

    var html = '<div class="card"><h2>Results</h2><div class="score">' + first.percent + '%</div><p class="small">' +
      first.correct + " correct" + (first.partial ? ", " + first.partial + " partly right" : "") + " out of " + first.total + " on the first try" +
      (state.pass > 1 ? " · after retries: " + scoreOf(ids, latest).percent + "%" : "") + "</p>" +
      '<table><thead><tr><th>Topic</th><th>Score</th><th style="width:40%">First try</th></tr></thead><tbody>';
    Object.keys(topics).forEach(function (t) {
      var s = scoreOf(topics[t].ids, state.first);
      html += "<tr><td>" + esc(t) + "</td><td>" + s.points + "/" + s.total + '</td><td><div class="meter" role="img" aria-label="' + s.percent + ' percent"><span style="width:' + s.percent + '%"></span></div></td></tr>';
    });
    html += "</tbody></table>" +
      '<div class="actions">' +
      (missed.length ? '<button class="btn" id="retry" type="button">Retry ' + missed.length + " missed</button>" : "") +
      '<button class="btn secondary" id="copy" type="button">Copy results for Claude</button>' +
      '<button class="btn secondary" id="download" type="button">Download results</button>' +
      '<button class="btn secondary" id="again" type="button">Start over</button></div>' +
      '<p class="small" style="margin-top:12px">Paste your results back to Claude so it can log them, update your error log and build the next round on what you missed.</p></div>';

    if (missed.length) {
      html += '<div class="card"><h2>Review what you missed</h2>';
      missed.forEach(function (q) {
        var a = state.answers[q.id] || {};
        var yours = a.response === undefined || a.response === null || a.response === "" ? "(no answer)" :
          q.type === "mcq" ? plain(q.options[a.response]) : q.type === "tf" ? (a.response ? "True" : "False") : String(a.response);
        html += '<div class="missed"><div class="meta"><span class="chip">' + esc(topicName(q.topic)) + "</span></div>" + md(q.prompt) +
          '<p class="small">Your answer: ' + esc(yours) + "</p><p><strong>" + (isOpen(q) ? "Model answer" : "Answer") + ":</strong> " + esc(answerText(q)) + "</p>" +
          (q.explanation ? md(q.explanation) : "") + (q.source ? '<span class="source">Source: ' + esc(q.source) + "</span>" : "") + "</div>";
      });
      html += "</div>";
    }
    app.innerHTML = html;

    if (missed.length) $("#retry").addEventListener("click", function () {
      state.order = missed.map(function (q) { return q.id; });
      state.order.forEach(function (id) { delete state.answers[id]; });
      state.pos = 0; state.pass++; state.finished = false; save(); render();
    });
    $("#copy").addEventListener("click", function () {
      var text = "Here are my quiz results. Please log them and build the next round on what I missed.\n\n```json\n" + JSON.stringify(payload(), null, 2) + "\n```";
      copy(text);
    });
    $("#download").addEventListener("click", function () {
      var blob = new Blob([JSON.stringify(payload(), null, 2)], { type: "application/json" });
      var link = document.createElement("a"); link.href = URL.createObjectURL(blob);
      link.download = (data.id || "quiz") + "-results.json"; document.body.appendChild(link); link.click();
      setTimeout(function () { URL.revokeObjectURL(link.href); link.remove(); }, 500);
    });
    $("#again").addEventListener("click", function () { store.remove(KEY); state = freshState(); render(); });
  }

  function payload() {
    var ids = questions.map(function (q) { return q.id; });
    return {
      quiz: data.id || null, title: data.title || null, course: data.course || null,
      started: state.startedAt, finished: state.finishedAt || localIso(),
      score: scoreOf(ids, state.first),
      answers: questions.map(function (q) {
        var a = state.answers[q.id] || {};
        var response = a.response;
        if (q.type === "mcq" && typeof response === "number") response = plain(q.options[response]);
        return { id: q.id, topic: q.topic || null, type: q.type, difficulty: q.difficulty || null, prompt: plain(q.prompt),
                 response: response === undefined ? null : response, correct: q.id in state.first ? state.first[q.id] : null,
                 afterRetry: a.correct === undefined ? null : a.correct, answer: answerText(q), source: q.source || null };
      })
    };
  }

  function toast(msg) { var t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(function () { t.classList.remove("show"); }, 2200); }
  function copy(text) {
    function fallback() {
      var area = document.createElement("textarea"); area.value = text; area.style.position = "fixed"; area.style.opacity = "0";
      document.body.appendChild(area); area.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      area.remove(); toast(ok ? "Copied. Paste it into your chat with Claude." : "Couldn't copy. Use Download results instead.");
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { toast("Copied. Paste it into your chat with Claude."); }, fallback);
    else fallback();
  }

  // Keyboard: 1-4 or A-D pick an option, T/F for true-false, Enter checks or moves on.
  document.addEventListener("keydown", function (e) {
    if (!state.started || state.finished || e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) return;
    var opts = app.querySelectorAll(".opt:not([disabled])");
    var key = e.key.toLowerCase(), index = -1;
    if (/^[1-9]$/.test(key)) index = +key - 1;
    else if (/^[a-i]$/.test(key) && opts.length > 2) index = key.charCodeAt(0) - 97;
    else if (opts.length === 2 && (key === "t" || key === "f")) index = key === "t" ? 0 : 1;
    if (index >= 0 && opts[index]) { opts[index].click(); opts[index].focus(); e.preventDefault(); }
    else if (key === "enter") {
      // Enter on a chosen option checks the answer instead of re-selecting it.
      var primary = app.querySelector("#actions .btn:not(.secondary):not([disabled])"), active = document.activeElement;
      if (primary && (!active || active.tagName !== "BUTTON" || active.classList.contains("opt"))) { primary.click(); e.preventDefault(); }
    }
  });

  render();
})();
</script>
</body>
</html>
